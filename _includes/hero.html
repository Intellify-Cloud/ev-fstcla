<!-- 
 hero.html 
 -->
<header class="hero" id="{{ site.data.sitetext.about.section | default: 'hero' }}" aria-label="Hero Section">
  <div class="container">
    <div class="hero-content">

      <!-- LEFT: Text -->
      <div class="hero-text-container">
        {%- if site.data.sitetext.header.title -%}
          <h1 class="section-heading">{{ site.data.sitetext.header.title }}</h1>
        {%- endif -%}

        {%- if site.data.sitetext.header.text -%}
          <p class="hero-subheading">{{ site.data.sitetext.header.text }}</p>
        {%- endif -%}

        <div class="hero-buttons">
          <a class="btn btn-primary js-scroll-trigger" href="/contact">Apply</a>
          <!-- <a class="btn btn-outline js-scroll-trigger" href="/contact">Apply for a bond</a> -->
        </div>
      </div>

      <!-- RIGHT: Image -->
      <div class="hero-image-container" role="img" aria-label="Bond Squad team"></div>

    </div>
  </div>
</header>
