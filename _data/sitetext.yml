faq:
  title: "Home Loan Questions"
  text: "Straight answers to common bond application questions."
  section: home-loan-faq
  list:
    - question: "How does home-loan pre-qualification work?"
      answer: "Pre-qualification is an early affordability discussion based on information such as income, expenses, credit profile and deposit. It helps you plan before making an offer, but it is not a final loan approval."
    - question: "What documents are usually needed for a bond application?"
      answer: "Banks commonly request identity documents, recent payslips or income proof, bank statements, details of monthly expenses, the signed Offer to Purchase and property information. Self-employed applicants may need additional business and tax documents."
    - question: "How long does bond approval take?"
      answer: "Timing varies by lender, application complexity and document readiness. A complete application can move faster, but final approval and registration remain subject to bank and conveyancing processes."
    - question: "Can self-employed applicants qualify for a home loan?"
      answer: "Yes, self-employed applicants can apply. Lenders usually require more detailed income and business documentation to assess affordability and risk."
    - question: "Does making an enquiry guarantee approval?"
      answer: "No. First Class Finance can help prepare and submit an application, but credit approval, rates and conditions are decided by the lender."
    - question: "Is First Class Finance a lender?"
      answer: "No. First Class Finance is a bond origination and home-loan assistance service. We help clients prepare applications and compare lender responses."

